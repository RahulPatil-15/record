<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign up - Record</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">

    </head>
    <body>
        <main class="auth">
            
            <div class="auth-card">
            
                <h1>Create your account</h1>
                <p class="subtitle">
                    Start recording what matters.
                </p>

                <form class="auth-form">
                    
                    <div class="field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                    </div>
                    
                    <button type="submit" class="btn">Create account</button>
                </form>
                
                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>

            </div>


        </main>
    </body>
</html>
